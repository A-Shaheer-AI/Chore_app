name: Chore Roulette Overdue & SMS Checker

on:
  schedule:
    # Runs every 30 minutes, 24/7 in the cloud with DB-level idempotency
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

jobs:
  check-overdues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run Overdue & SMS Check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://khsqirrkrquliyzbweej.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_29rwbNgCqY4QzAj7inLeyQ_x-kRMwj5' }}
        run: node scripts/check-overdue.mjs
